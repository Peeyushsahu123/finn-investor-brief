<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FINN — your investing signal</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">finn<i>.</i></div>
    <div class="badge" id="badge"><b></b><span>…</span></div>
  </header>
  <main>
    <section class="tab on" id="t-today"></section>
    <section class="tab" id="t-ask"></section>
    <section class="tab" id="t-book"></section>
    <section class="tab" id="t-rules"></section>
  </main>
  <div class="composer" id="composer">
    <div class="ctxchip" id="ctxchip"></div>
    <div class="in">
      <input id="q" placeholder="Ask about a company…" autocomplete="off" enterkeyhint="send">
      <button class="ib mic" id="mic" aria-label="Voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="ib" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <nav class="bar">
    <button data-t="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg>Today<span class="dot" id="dot" hidden></span></button>
    <button data-t="ask"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.2A8 8 0 1 1 21 12z"/></svg>Ask</button>
    <button data-t="book"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg>Book</button>
    <button data-t="rules"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Rules</button>
  </nav>
</div>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><button class="x" id="sx">×</button><div class="body" id="sbody"></div></div>
<div class="toast" id="toast"><b></b><span></span></div>
<script src="app.js"></script>
</body>
</html>
