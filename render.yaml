services:
  - type: web
    name: finn
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FINN_MODE
        value: demo          # live if Yahoo/NSE/screener reachable, else synthetic demo
